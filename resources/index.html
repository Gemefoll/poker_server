<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        body {
            background-color: #257c33;
        }
    </style>
    <meta charset="UTF-8">
    <title>Poker</title>
</head>

<body>
    <h1>Your cards: </h1>
    <img src="/card_img/{{.Card1}}.png" alt="{{.Card1}}" width="10%">
    <img src="/card_img/{{.Card2}}.png" alt="{{.Card2}}" width="10%">

    <div id="table">
        <h1>Table: </h1>
        {{range .Table}}<img src="/card_img/{{.}}.png" alt="{{.}}" width="18%"> {{end}}
    </div>
    <button id="fold_btn">Fold</button>

    <h2>Current balance: {{.Bal}}</h2>
